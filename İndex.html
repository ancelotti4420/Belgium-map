<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belgium Map</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .title {
      position: absolute;
      z-index: 1000;
      top: 15px;
      left: 15px;
      background: rgba(20,20,20,.9);
      padding: 10px 15px;
      border-radius: 12px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="title">🇧🇪 Belgium Map</div>

  <div id="map"></div>

</body>
</html>
